[project]
name = "myworkshop"
version = "0.2.0"
description = "MyWorkshop : inventaire et gestion d'atelier auto-hébergé"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# pymupdf + zxing-cpp : rasterisent et décodent les planches PDF dans les tests.
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pymupdf>=1.24", "zxing-cpp>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
